server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Contrato de upload do backend é 10MB (app/config/settings.py,
    # MAX_UPLOAD_BYTES) — sem isso o default de 1MB do nginx rejeita com
    # um 413 em HTML puro antes do request chegar no backend. Ver C3.
    client_max_body_size 10m;

    # Mesmo papel do proxy do Vite dev (ver frontend/vite.config.ts,
    # server.proxy) — o browser só fala com um host (o frontend), sem
    # precisar de CORS no backend. O fluxo legado em Jinja2 (que vivia fora
    # de /api/*, sem essa exigência) foi removido junto com a autenticação
    # JWT — todo endpoint do backend hoje está sob /api/* e exige token
    #.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/tickets/{id}/enrich (Qwen na CPU), /api/tickets/generate-from-file
        # (cascata BERT em até 5000 linhas) e outras rotas longas podem passar
        # dos 60s default do nginx. Ver I4.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Client-side routing da SPA — refresh em /kanban, /dashboard etc. não
    # pode virar 404 do nginx.
    location / {
        try_files $uri /index.html;
    }
}

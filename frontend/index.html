<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v=1: o conteúdo do favicon.svg nunca mudou desde o scaffold do
         projeto, mas o Chrome cacheia favicon por URL e ignora até
         reload forçado — a query string força o navegador a rebuscar o
         arquivo em vez de reaproveitar um ícone antigo (ex.: do Vite)
         que ele guardou de alguma visita anterior ao domínio local. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoITIL</title>
    <script>
      (function () {
        var stored = localStorage.getItem('autoitil-theme')
        var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', isDark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

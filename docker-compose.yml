# WARNING: default credentials below (autoitil/autoitil) are for LOCAL DEV ONLY.
# Override POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB via env vars for any shared or production environment.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoitil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoitil}
      POSTGRES_DB: ${POSTGRES_DB:-autoitil}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - autoitil_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoitil} -d ${POSTGRES_DB:-autoitil}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-autoitil}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-autoitil123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - autoitil_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-autoitil} ${MINIO_ROOT_PASSWORD:-autoitil123};
      mc mb -p local/${S3_BUCKET:-autoitil-uploads};
      exit 0;
      "

  backend:
    build:
      context: ./backend
      args:
        HF_TOKEN: ${HF_TOKEN}
    profiles: ["app"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autoitil}:${POSTGRES_PASSWORD:-autoitil}@db:5432/${POSTGRES_DB:-autoitil}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-autoitil}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-autoitil123}
      AWS_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-autoitil-uploads}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-local-only-change-me}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-168}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_BACKEND: ${METRICS_BACKEND:-noop}
      METRICS_NAMESPACE: ${METRICS_NAMESPACE:-AutoITIL}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
    profiles: ["app"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  autoitil_pgdata:
  autoitil_minio_data:
